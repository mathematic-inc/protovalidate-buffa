[package]
name = "protovalidate-buffa-protos"
version = "0.7.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Generated Buffa types for buf/validate/validate.proto, including canonical validation error details."
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
buffa = "0.9.1"
buffa-descriptor = "0.9.1"
buffa-types = "0.9.1"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
buffa-build = "=0.9.2"

[features]
default = ["views"]
json = ["buffa-descriptor/json", "buffa-types/json", "buffa/json", "dep:serde", "dep:serde_json"]
views = []

[lints]
workspace = true
