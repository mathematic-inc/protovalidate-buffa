[package]
name = "protovalidate-buffa-conformance"
version = "0.0.26"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Conformance executor for the upstream protovalidate-conformance harness."
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[[bin]]
name = "protovalidate-buffa-conformance"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
buffa = "0.9.2"
buffa-descriptor = "0.9.2"
buffa-types = "0.9.2"
protovalidate-buffa = { path = "../protovalidate-buffa", version = "0.7.2", default-features = false, features = ["tz"] }
protovalidate-buffa-protos = { path = "../protovalidate-buffa-protos", version = "0.7.1" }

[dev-dependencies]
# Referenced by the emit-compile fixture (`tests/emit_compiles.rs`) for
# Duration / Timestamp typing in transpiler outputs. Runtime crate
# already depends on chrono via protovalidate-buffa.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# Exercise Connect handlers against the generated request views.
connectrpc = { version = "0.9.1", default-features = false }
protovalidate-buffa = { path = "../protovalidate-buffa", version = "0.7.2", default-features = false, features = ["connect"] }

[build-dependencies]
anyhow = "1.0.104"
buffa = "0.9.2"
buffa-build = "0.9.2"
buffa-codegen = "0.9.2"
prettyplease = "0.3.0"
proc-macro2 = "1.0.107"
protoc-gen-protovalidate-buffa = { path = "../protoc-gen-protovalidate-buffa", version = "0.10.7" }
# Construct the rule-position matrix from typed validation descriptors.
protovalidate-buffa-protos = { path = "../protovalidate-buffa-protos", version = "0.7.1" }
quote = "1.0.47"
syn = { version = "3.0.9", features = ["full"] }

[lints]
workspace = true
