syntax = "proto3";

package buf.validate.conformance.cases;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

// Regression for https://github.com/mathematic-inc/protovalidate-buffa/discussions/44.
message CelTimestampRange {
  option (buf.validate.message).cel = {
    id: "timestamp_range.ordered"
    expression: "!has(this.start) || !has(this.end) || this.start < this.end"
  };
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
}

message CelDurationRange {
  option (buf.validate.message).cel = {
    id: "duration_range.ordered"
    expression: "!has(this.start) || !has(this.end) || this.start < this.end"
  };
  google.protobuf.Duration start = 1;
  google.protobuf.Duration end = 2;
}

message CelWktElements {
  repeated google.protobuf.Timestamp timestamps = 1 [(buf.validate.field).repeated.items.cel = {
    id: "timestamp.after_epoch"
    expression: "this > timestamp('1970-01-01T00:00:00Z')"
  }];
  map<string, google.protobuf.Duration> durations = 2 [(buf.validate.field).map.values.cel = {
    id: "duration.positive"
    expression: "this > duration('0s')"
  }];
}

message CelTimestampFields {
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
}

message CelTimestampEnvelope {
  CelTimestampFields range = 1;
}

message CelNestedTimestampRange {
  CelTimestampEnvelope envelope = 1 [(buf.validate.field).cel = {
    id: "nested_timestamp_range.ordered"
    expression: "!has(this.range) || !has(this.range.start) || !has(this.range.end) || this.range.start < this.range.end"
  }];
}

// Unguarded access reads protobuf defaults, even when has() is false.
message CelTimestampDefaults {
  option (buf.validate.message).cel = {
    id: "timestamp_defaults.ordered"
    expression: "this.start < this.end"
  };
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
}

message CelDurationDefaults {
  option (buf.validate.message).cel = {
    id: "duration_defaults.ordered"
    expression: "this.start < this.end"
  };
  google.protobuf.Duration start = 1;
  google.protobuf.Duration end = 2;
}

message CelNestedTimestampDefaults {
  CelTimestampEnvelope envelope = 1 [(buf.validate.field).cel = {
    id: "nested_timestamp_defaults.ordered"
    expression: "this.range.start < this.range.end"
  }];
}

// Subtracting timestamps gives a duration to compare with a literal.
message CelTimestampSpan {
  option (buf.validate.message).cel = {
    id: "board.range"
    message: "a board covers one day at most"
    expression: "this.to > this.from && this.to - this.from <= duration('25h')"
  };
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
}

message CelScheduledSpan {
  option (buf.validate.message).cel = {
    id: "assign.length"
    message: "a job ends after it starts, within 12 hours"
    expression: "this.scheduled_end > this.scheduled_start && this.scheduled_end - this.scheduled_start <= duration('12h')"
  };
  google.protobuf.Timestamp scheduled_start = 1;
  google.protobuf.Timestamp scheduled_end = 2;
}

// Every timestamp and duration overload of + and -.
message CelTemporalArithmetic {
  option (buf.validate.message).cel = {
    id: "timestamp_plus_duration"
    expression: "this.start + this.length == this.end"
  };
  option (buf.validate.message).cel = {
    id: "duration_plus_timestamp"
    expression: "this.length + this.start == this.end"
  };
  option (buf.validate.message).cel = {
    id: "timestamp_minus_duration"
    expression: "this.end - this.length == this.start"
  };
  option (buf.validate.message).cel = {
    id: "timestamp_minus_timestamp"
    expression: "this.end - this.start == this.length"
  };
  option (buf.validate.message).cel = {
    id: "duration_minus_duration"
    expression: "this.length - this.rest >= duration('0s')"
  };
  option (buf.validate.message).cel = {
    id: "duration_plus_duration"
    expression: "this.length + this.rest < duration('8h')"
  };
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
  google.protobuf.Duration length = 3;
  google.protobuf.Duration rest = 4;
}

// Results outside CEL's ranges are runtime errors: durations hold an int64
// count of nanoseconds, and timestamps run from year 1 to year 9999.
message CelTemporalOverflow {
  option (buf.validate.message).cel = {
    id: "span"
    expression: "this.end - this.start >= duration('0s')"
  };
  option (buf.validate.message).cel = {
    id: "shifted"
    expression: "this.end + this.shift >= this.start"
  };
  option (buf.validate.message).cel = {
    id: "doubled"
    expression: "this.shift + this.shift >= duration('0s')"
  };
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
  google.protobuf.Duration shift = 3;
}

// An operand that decides && or || on its own discards an error from the
// other operand, as CEL specifies.
message CelTemporalLogicalErrors {
  option (buf.validate.message).cel = {
    id: "and"
    expression: "this.end - this.start <= duration('1h') && this.end > this.start"
  };
  option (buf.validate.message).cel = {
    id: "or"
    expression: "this.end - this.start <= duration('1h') || this.end <= this.start"
  };
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
}

// Likewise, an element that decides all() or exists() discards errors from
// the other elements.
message CelTemporalQuantifierErrors {
  option (buf.validate.message).cel = {
    id: "all"
    expression: "this.slots.all(s, s.end - s.start <= duration('1h'))"
  };
  option (buf.validate.message).cel = {
    id: "exists"
    expression: "this.slots.exists(s, s.end - s.start > duration('1h'))"
  };
  message Slot {
    google.protobuf.Timestamp start = 1;
    google.protobuf.Timestamp end = 2;
  }
  repeated Slot slots = 1;
}

// Regression for https://github.com/mathematic-inc/protovalidate-buffa/discussions/90.
message CelFieldMaskPaths {
  option (buf.validate.message).cel = {
    id: "item.display_name.required"
    message: "display_name is required"
    expression: "!('display_name' in this.update_mask.paths) || this.item.display_name != ''"
  };
  message Item {
    string display_name = 1;
  }
  Item item = 1;
  google.protobuf.FieldMask update_mask = 2 [(buf.validate.field).cel = {
    id: "update_mask.not_empty"
    message: "the update writes no fields"
    expression: "size(this.paths) > 0"
  }];
}

message CelFieldMaskOperations {
  option (buf.validate.message).cel = {
    id: "message.size"
    expression: "size(this.update_mask.paths) > 0"
  };
  option (buf.validate.message).cel = {
    id: "message.receiver_size"
    expression: "this.update_mask.paths.size() > 0"
  };
  option (buf.validate.message).cel = {
    id: "message.in"
    expression: "'display_name' in this.update_mask.paths"
  };
  option (buf.validate.message).cel = {
    id: "message.exists"
    expression: "this.update_mask.paths.exists(p, p == 'display_name')"
  };
  option (buf.validate.message).cel = {
    id: "message.presence"
    expression: "has(this.update_mask) == this.mask_present"
  };
  google.protobuf.FieldMask update_mask = 1 [
    (buf.validate.field).cel = {
      id: "field.size"
      message: "paths must not be empty"
      expression: "size(this.paths) > 0"
    },
    (buf.validate.field).cel = {
      id: "field.receiver_size"
      message: "paths must not be empty"
      expression: "this.paths.size() > 0"
    },
    (buf.validate.field).cel = {
      id: "field.in"
      message: "paths must contain display_name"
      expression: "'display_name' in this.paths"
    },
    (buf.validate.field).cel = {
      id: "field.exists"
      message: "paths must contain display_name"
      expression: "this.paths.exists(p, p == 'display_name')"
    }
  ];
  bool mask_present = 2;
}
