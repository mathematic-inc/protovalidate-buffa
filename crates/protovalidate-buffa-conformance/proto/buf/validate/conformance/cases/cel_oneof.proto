syntax = "proto3";

package buf.validate.conformance.cases;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

message CelOneofPresence {
  option (buf.validate.message).cel = {
    id: "oneof.presence"
    expression: "has(this.number) == (this.selected == 1) && has(this.text) == (this.selected == 2) && has(this.child) == (this.selected == 3) && has(this.stamp) == (this.selected == 4)"
  };

  int32 selected = 1;
  oneof choice {
    int32 number = 2;
    string text = 3;
    CelOneofChild child = 4;
    google.protobuf.Timestamp stamp = 5;
  }
}

message CelOneofChild {
  string id = 1;
}

// Message-level CEL reads a oneof alternative's value while it is selected,
// and the alternative's default otherwise.
message CelOneofValue {
  option (buf.validate.message).cel = {
    id: "oneof.number"
    expression: "this.number == this.want_number"
  };
  option (buf.validate.message).cel = {
    id: "oneof.count"
    expression: "this.count == this.want_count"
  };
  option (buf.validate.message).cel = {
    id: "oneof.ratio"
    expression: "this.ratio == this.want_ratio"
  };
  option (buf.validate.message).cel = {
    id: "oneof.flag"
    expression: "this.flag == this.want_flag"
  };
  option (buf.validate.message).cel = {
    id: "oneof.color"
    expression: "this.color == this.want_color"
  };
  option (buf.validate.message).cel = {
    id: "oneof.text"
    expression: "this.text == this.want_text"
  };
  option (buf.validate.message).cel = {
    id: "oneof.data"
    expression: "this.data == this.want_data"
  };
  option (buf.validate.message).cel = {
    id: "oneof.child"
    expression: "this.child.id == this.want_child_id"
  };
  option (buf.validate.message).cel = {
    id: "oneof.stamp"
    expression: "this.stamp == this.want_stamp"
  };

  int32 want_number = 1;
  uint64 want_count = 2;
  double want_ratio = 3;
  bool want_flag = 4;
  CelOneofColor want_color = 5;
  string want_text = 6;
  bytes want_data = 7;
  string want_child_id = 8;
  google.protobuf.Timestamp want_stamp = 9;
  oneof choice {
    int32 number = 10;
    uint64 count = 11;
    double ratio = 12;
    bool flag = 13;
    CelOneofColor color = 14;
    string text = 15;
    bytes data = 16;
    CelOneofChild child = 17;
    google.protobuf.Timestamp stamp = 18;
  }
}

enum CelOneofColor {
  CEL_ONEOF_COLOR_UNSPECIFIED = 0;
  CEL_ONEOF_COLOR_RED = 1;
}

message CelOneofContainer {
  option (buf.validate.message).cel = {
    id: "oneof.message_list"
    expression: "this.many.all(v, has(v.number))"
  };

  CelOneofPresence single = 1 [(buf.validate.field).cel = {
    id: "oneof.field"
    expression: "has(this.number)"
  }];
  repeated CelOneofPresence many = 2 [(buf.validate.field).cel = {
    id: "oneof.field_list"
    expression: "this.all(v, has(v.number))"
  }];
}

message MessageOneofPresence {
  option (buf.validate.message).oneof = {
    fields: [
      "number",
      "text",
      "outside"
    ]
    required: true
  };

  oneof choice {
    int32 number = 1;
    string text = 2;
  }
  string outside = 3;
}

message CelMessageTree {
  option (buf.validate.message).cel = {
    id: "tree.unique_children"
    expression: "this.children.all(c, this.children.filter(t, t.id == c.id).size() == 1)"
  };

  string id = 1;
  repeated CelMessageTree children = 2;
}

message CelOneofOuter {
  message Middle {
    message Inner {
      option (buf.validate.message).cel = {
        id: "nested_oneof.presence"
        expression: "has(this.number) == (this.selected == 1)"
      };
      option (buf.validate.message).oneof = {
        fields: [
          "text",
          "outside"
        ]
      };

      int32 selected = 1;
      oneof choice {
        option (buf.validate.oneof).required = true;
        int32 number = 2 [(buf.validate.field).int32.gt = 0];
        string text = 3;
      }
      string outside = 4;
      oneof mode {
        bool strict = 5 [(buf.validate.field).required = true];
        bool lenient = 6;
      }
    }
    Inner inner = 1;
  }
  Middle middle = 1;
}
