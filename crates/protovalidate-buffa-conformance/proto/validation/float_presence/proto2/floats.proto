syntax = "proto2";

package validation.float_presence.proto2;

import "buf/validate/validate.proto";

// https://github.com/mathematic-inc/protovalidate-buffa/discussions/111
message FiniteRules {
  optional float float_value = 1 [(buf.validate.field).float = {finite: true}];
  optional double double_value = 2 [(buf.validate.field).double = {finite: true}];
  repeated float float_items = 3 [(buf.validate.field).repeated.items.float = {finite: true}];
  repeated double double_items = 4 [(buf.validate.field).repeated.items.double = {finite: true}];
  optional float float_bounds = 5 [(buf.validate.field).float = {
    finite: true
    gt: 0
  }];
  optional double double_bounds = 6 [(buf.validate.field).double = {
    finite: true
    gt: 0
  }];
  repeated float float_bound_items = 7 [(buf.validate.field).repeated.items.float = {
    finite: true
    gte: 0
  }];
  repeated double double_bound_items = 8 [(buf.validate.field).repeated.items.double = {
    finite: true
    gte: 0
  }];
  optional float float_disabled = 9 [(buf.validate.field).float = {finite: false}];
  optional double double_disabled = 10 [(buf.validate.field).double = {finite: false}];
  optional float float_ignored = 11 [
    (buf.validate.field).ignore = IGNORE_ALWAYS,
    (buf.validate.field).float = {finite: true}
  ];
  optional double double_ignored = 12 [
    (buf.validate.field).ignore = IGNORE_ALWAYS,
    (buf.validate.field).double = {finite: true}
  ];
  optional float float_zero = 13 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).float = {
      finite: true
      gt: 0
    }
  ];
  optional double double_zero = 14 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).double = {
      finite: true
      gt: 0
    }
  ];
  repeated float float_ignored_items = 15 [
    (buf.validate.field).repeated.items.ignore = IGNORE_ALWAYS,
    (buf.validate.field).repeated.items.float = {finite: true}
  ];
  repeated double double_ignored_items = 16 [
    (buf.validate.field).repeated.items.ignore = IGNORE_ALWAYS,
    (buf.validate.field).repeated.items.double = {finite: true}
  ];
  repeated float float_zero_items = 17 [
    (buf.validate.field).repeated.items.ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).repeated.items.float = {
      finite: true
      gt: 0
    }
  ];
  repeated double double_zero_items = 18 [
    (buf.validate.field).repeated.items.ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).repeated.items.double = {
      finite: true
      gt: 0
    }
  ];
}
