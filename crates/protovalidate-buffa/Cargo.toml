[package]
name = "protovalidate-buffa"
version = "0.7.1"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Runtime for protoc-gen-protovalidate-buffa — Validate trait, ValidationError types, rule helpers, and the CelScalar / Duration / Timestamp helpers that compile-time-expanded CEL rules call into. No CEL interpreter at runtime."
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
base64 = { version = "0.22", optional = true }
buffa = "0.9.1"
buffa-descriptor = { version = "0.9.1", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = { version = "0.10", optional = true }
connectrpc = { version = "0.9", default-features = false, optional = true }
fluent-uri = "0.4"
http = "1"
ipnet = "2"
percent-encoding = "2"
protovalidate-buffa-macros = { path = "../protovalidate-buffa-macros", version = "0.4.0" }
protovalidate-buffa-protos = { path = "../protovalidate-buffa-protos", version = "0.7.0", optional = true }
regex = "1"
ulid = "3"
uuid = "1"

[dev-dependencies]
buffa-types = { version = "0.9.1", features = ["json"] }
connectrpc = { version = "0.9", default-features = false, features = ["client", "json"] }
http-body-util = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }

[features]
default = ["connect"]
connect = ["dep:base64", "dep:connectrpc", "protos"]
json = ["protos", "protovalidate-buffa-protos/json"]
protos = ["dep:buffa-descriptor", "dep:protovalidate-buffa-protos"]
# Enables `chrono-tz` for the timezone argument on CEL timestamp
# accessors (`t.getHours("America/New_York")`). chrono-tz ships the
# full IANA database (~4 MiB), so it's opt-in — rules that only use
# the no-arg accessor forms have no reason to pay the cost. When the
# feature is off, generated code that references the tz arg fails to
# compile with a clear "chrono_tz" missing-module error.
tz = ["dep:chrono-tz"]

[lints]
workspace = true
