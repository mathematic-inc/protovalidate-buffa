[package]
name = "protoc-gen-protovalidate-buffa"
version = "0.9.1"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "protoc plugin that emits static Rust Validate impls from buf.validate annotations for buffa-generated messages. CEL expressions are transpiled to native Rust at codegen time — no runtime interpreter."
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/protoc-gen-protovalidate-buffa-v{ version }/{ name }-{ version }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/protoc-gen-protovalidate-buffa-v{ version }/{ name }-{ version }-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/protoc-gen-protovalidate-buffa-v{ version }/{ name }-{ version }-{ target }.zip"
pkg-fmt = "zip"

[lib]
path = "src/lib.rs"

[[bin]]
name = "protoc-gen-protovalidate-buffa"
path = "src/main.rs"

[dependencies]
anyhow = "1"
buffa = "0.9.1"
buffa-codegen = "0.9.1"
buffa-types = "0.9.1"
# Used parse-only — the runtime interpreter, regex pattern matching, and
# chrono-based timestamp handling all live on the runtime side or get
# transpiled away at codegen time, so the plugin can opt out of the
# `regex` and `chrono` default features.
cel = { version = "0.14", default-features = false }
prettyplease = "0.3"
proc-macro2 = "1"
protovalidate-buffa-protos = { path = "../protovalidate-buffa-protos", version = "0.7.1" }
quote = "1"
syn = { version = "3", features = ["full"] }

[lints]
workspace = true
